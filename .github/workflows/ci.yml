name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install jpm
        run: |
          curl -fsSL https://github.com/NonSwag/jpm/releases/latest/download/install.sh | sh
          echo "$HOME/.jpm/bin" >> "$GITHUB_PATH"
      - name: Test
        run: jpm test --frozen
      - name: Build
        run: jpm build
