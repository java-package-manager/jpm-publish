name: CI

on:
  # Tags are not pushed by hand: CI creates them when the version changes (see the version job).
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs first and decides whether this run releases (outputs.release): the main branch has a version in
  # project.jsonc that has no tag yet, so CI tags this commit once the tests pass.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to release
        id: decide
        run: |
          version=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' project.jsonc | head -n 1)
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] && \
             ! git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            release=true
            echo "::notice::$version has no release yet: releasing it"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: $release ($version)"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install jpm
        run: |
          curl -fsSL https://github.com/NonSwag/jpm/releases/latest/download/install.sh | sh
          echo "$HOME/.jpm/bin" >> "$GITHUB_PATH"
          # jpm-publish needs `jpm info --json` and the "url"/"extensions" manifest fields (jpm 0.4.0)
          v=$("$HOME/.jpm/bin/jpm" --version | cut -d' ' -f2)
          printf '%s\n%s\n' "0.4.0" "$v" | sort -V -C || { echo "::error::jpm $v is too old; jpm-publish needs 0.4.0 or newer"; exit 1; }

      - name: Test
        run: jpm test --frozen

      - name: Build
        run: jpm build

      - name: Publish itself to a folder repository
        run: |
          set -eux
          repo="$RUNNER_TEMP/repo"
          JPM_EXE=jpm JPM_PROJECT_DIR="$PWD" java -jar dist/jpm-publish-*.jar "file://$repo" --javadoc
          v=$(jpm info --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          base="$repo/dev/jpm/jpm-publish/$v/jpm-publish-$v"
          for f in .jar .pom -sources.jar -javadoc.jar; do
            test -f "$base$f"
            test -f "$base$f.sha512"
          done
          grep -q '<artifactId>jpm-publish</artifactId>' "$base.pom"
          grep -q "<version>$v</version>" "$repo/dev/jpm/jpm-publish/maven-metadata.xml"

  # jpm installs extensions from their Git source, so a release is just a tag: it is what
  # `jpm add -g github:NonSwag/jpm-publish` resolves (^<version>) instead of the main branch.
  tag:
    name: tag
    if: needs.version.outputs.release == 'true'
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag this commit with its version
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::$VERSION is already tagged"
            exit 0
          fi
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          echo "::notice::tagged $GITHUB_SHA as $VERSION"
