name: CI

on:
  # Tags are not pushed by hand: CI creates them when the version changes (see the version job).
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs first and decides whether this run releases (outputs.release): the main branch has a version in
  # project.jsonc that has no tag yet, so CI tags this commit once the tests pass.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to release
        id: decide
        run: |
          version=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' project.jsonc | head -n 1)
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] && \
             ! git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            release=true
            echo "::notice::$version has no release yet: releasing it"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: $release ($version)"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jpm-publish talks to jpm over its protocol (`jpm api`), which is in canary builds until jpm 0.12.0
      - uses: java-package-manager/setup-jpm@v1
        with:
          version: canary
          java: "21"

      - name: No comments in the sources
        run: java checks/Comments.java check src test

      - name: Test
        run: jpm test --frozen

      - name: Build
        run: jpm build

      - name: Publish a sample project to a folder repository
        run: |
          set -eux
          repo="$RUNNER_TEMP/repo"
          demo="$RUNNER_TEMP/demo"
          mkdir -p "$demo/src/demo"
          printf '{ "name": "demo", "group": "dev.example", "version": "1.0.0", "description": "A demo", "license": "MIT" }\n' > "$demo/project.jsonc"
          printf 'package demo;\n\n/** A demo. */\npublic class Demo {\n    /** @return hi */\n    public static String hi() { return "hi"; }\n}\n' > "$demo/src/demo/Demo.java"
          JPM_EXE=jpm JPM_PROJECT_DIR="$demo" jpm start -- "file://$repo" --javadoc
          base="$repo/dev/example/demo/1.0.0/demo-1.0.0"
          for f in .jar .pom .module -sources.jar -javadoc.jar; do
            test -f "$base$f"
            test -f "$base$f.sha512"
          done
          grep -q '<artifactId>demo</artifactId>' "$base.pom"
          grep -q "<version>1.0.0</version>" "$repo/dev/example/demo/maven-metadata.xml"

  # jpm installs extensions from their Git source, so a release is just a tag: it is what
  # `jpm add -g github:java-package-manager/jpm-publish` resolves (^<version>) instead of the main branch.
  tag:
    name: tag
    if: needs.version.outputs.release == 'true'
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag this commit with its version
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::$VERSION is already tagged"
            exit 0
          fi
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          echo "::notice::tagged $GITHUB_SHA as $VERSION"
